<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Diya</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d8f3e8;--ink:#143c30;--rose:#e8476b;--blush:#ffd9e0;--cream:#fbf8f1;--gold:#e2b865;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2a22;--ink:#e6fbf1}}
:root[data-theme="dark"]{--bg:#0f2a22;--ink:#e6fbf1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Fraunces,Georgia,serif;-webkit-tap-highlight-color:transparent}
.hand{font-family:Caveat,cursive;font-weight:700}
.s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow:auto;text-align:center;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
.s.on{opacity:1;visibility:visible}
.w{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
h1,h2{margin:0;font-weight:700;line-height:1.05}
.btn{font:700 18px Fraunces,Georgia,serif;border:0;border-radius:99px;padding:14px 28px;background:var(--rose);color:#fff;box-shadow:0 8px 20px #e8476b66;cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.nx{opacity:0;pointer-events:none;transition:opacity .7s}
.nx.show{opacity:1;pointer-events:auto}
/* cover */
#s0{background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--bg),#fff 55%),var(--bg) 72%)}
#s0 .hand{font-size:32px;margin:0}
#s0 h1{font-size:clamp(34px,10.5vw,50px);letter-spacing:-.01em}
#hs{width:min(82vw,330px);height:auto;overflow:visible;filter:drop-shadow(0 14px 18px #8a1c3a40)}
.rz{transform:scale(0);animation:b .7s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes b{to{transform:scale(1)}}
.bw{opacity:0;animation:f .9s 1.1s forwards}
@keyframes f{to{opacity:1}}
/* camera */
#s1{background:linear-gradient(#ffffff16 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,#ffffff16 1px,transparent 1px) 0 0/28px 28px,#0f6b57;color:#eafff5;padding-top:calc(env(safe-area-inset-top,0px) + 74px)}
.rib{position:absolute;top:0;left:0;right:0;height:62px;background:radial-gradient(circle at 20px 28px,var(--cream) 20px,transparent 21px) 0 0/40px 62px repeat-x,linear-gradient(var(--cream),var(--cream)) 0 0/100% 28px no-repeat}
.rib i{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 2px);font-size:34px;transform:translateX(-50%);font-style:normal}
#s1 h2{font-size:34px}
.cam{width:min(90vw,340px);padding:16px;border-radius:22px;background:linear-gradient(145deg,#f4f7fb,#c0c9d5);box-shadow:0 18px 40px #0008,inset 0 0 0 2px #fffa;display:grid;grid-template-columns:1fr 66px;gap:12px;box-sizing:border-box}
.scr{aspect-ratio:1/.9;border-radius:8px;overflow:hidden;background:#15201c;border:3px solid #8e99a6;position:relative;display:grid;place-items:center;color:#cfe;font-size:22px}
.scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;opacity:0;filter:blur(16px) brightness(.3) grayscale(1);transition:filter 2.6s ease-out,opacity .4s}
.scr img.dev{opacity:1;filter:none}
.ctl{display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.lens{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7ea0c8,#14213a 55%,#05070d);box-shadow:0 0 0 4px #aeb8c4}
.dial{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#e8edf3 36%,#9aa5b2 38%,#e3e8ee 60%,#8f9aa8 62%)}
.shut{width:44px;height:44px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff8fa6,#d12f58);box-shadow:0 0 0 4px #aeb8c4,0 0 0 0 #e8476b;animation:pu 1.6s infinite;cursor:pointer}
.shut.done{animation:none}
@keyframes pu{70%{box-shadow:0 0 0 4px #aeb8c4,0 0 0 14px #e8476b00}100%{box-shadow:0 0 0 4px #aeb8c4,0 0 0 0 #e8476b00}}
#lt{font-family:Caveat,cursive;font-weight:500;font-size:25px;line-height:1.2;max-width:330px;min-height:6.2em;margin:0}
.fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
.fl.go{animation:fl .8s}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
/* diary */
#s2{background:radial-gradient(circle at 50% 30%,#c4435c,#8c1d36 75%);color:#fff}
#s2 h2{font-size:30px}
.bk{all:unset;cursor:pointer;display:block;width:min(86vw,330px);perspective:1400px;-webkit-tap-highlight-color:transparent}
.bi{display:block;position:relative;aspect-ratio:4/5;transition:transform 1s cubic-bezier(.5,0,.2,1);transform-style:preserve-3d}
.bk.flip .bi{transform:rotateY(180deg)}
.f{position:absolute;inset:0;box-sizing:border-box;background:var(--cream);color:#3a1620;border-radius:6px 16px 16px 6px;box-shadow:0 20px 40px #0006;padding:26px 24px 20px 40px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:left}
.f::before{content:"";position:absolute;left:-11px;top:14px;bottom:14px;width:22px;background:radial-gradient(circle at 50% 50%,#d9d4c8 6px,#7a6f5f 7px,transparent 8px) 0 0/22px 54px repeat-y}
.f.b{transform:rotateY(180deg);align-items:center;text-align:center;padding-left:34px}
.f h3{margin:0;font-size:34px;color:var(--rose)}
.f p{margin:0;font-size:17px;line-height:1.6}
.f .hand{font-size:22px;color:#8c1d36}
.pol{background:#fff;padding:10px 10px 12px;box-shadow:0 8px 18px #0003;transform:rotate(-3deg);width:78%;position:relative}
.pol::before{content:"";position:absolute;top:-11px;left:50%;width:70px;height:22px;margin-left:-35px;background:#e8476b99;transform:rotate(4deg)}
.pol img{display:block;width:100%;aspect-ratio:1/1.1;object-fit:cover;object-position:50% 12%}
/* cake */
#s3{background:radial-gradient(circle at 50% 45%,#2f604b,#0a1d17 72%);color:var(--cream)}
#s3 h2{font-size:32px}
#ck{width:min(74vw,290px);height:auto;overflow:visible}
.fm{transform-box:fill-box;transform-origin:50% 100%;animation:fk .45s infinite alternate ease-in-out;filter:drop-shadow(0 0 7px #ffcf6e)}
@keyframes fk{to{transform:scale(.85,1.12) rotate(3deg)}}
.out .fm{animation:none;opacity:0;transform:scale(.2);transition:.7s}
#msg h2{font-size:42px}
#msg p{margin:8px 0 0;font-size:18px;line-height:1.5;max-width:300px}
#cv{position:fixed;inset:0;pointer-events:none;z-index:8}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<div class="fl" id="fl"></div><canvas id="cv"></canvas>

<p class="hand">Hi Penguin 🐧</p>
<h1>Happy birthday,<br>Diya!</h1>

<button class="btn" data-go="1">Open your gift</button>
</div></section>

 .forEach(([fr,d])=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=fr;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d*.95);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}
